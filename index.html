<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />

    <!-- SEO: o'zingizning ma'lumotingizga moslang -->
    <title>Javlon Abdullayev — Frontend Developer</title>
    <meta
      name="description"
      content="Frontend developer. React, TypeScript va zamonaviy web interfeyslar. Loyihalarim, tajribam va bog'lanish ma'lumotlarim."
    />
    <meta name="author" content="Javlon Abdullayev" />
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph / ijtimoiy tarmoqlarda ulashish -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Javlon Abdullayev — Frontend Developer" />
    <meta
      property="og:description"
      content="Frontend developer. React, TypeScript va zamonaviy web interfeyslar."
    />
    <meta property="og:url" content="https://example.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Sahifa chizilishidan oldin temani qo'llaymiz — "oq ko'zni qamashtirish" bo'lmasligi uchun
      ;(function () {
        try {
          var saved = localStorage.getItem('theme')
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var lang = localStorage.getItem('lang')
          if (lang) document.documentElement.lang = lang
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
